<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <title>Convertidor COP ↔ USD</title>

  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Convertidor">
  <meta name="theme-color" content="#2c1e63">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet: #4c3bcf;
      --magenta: #e8447e;
      --cyan: #17d9c4;
      --ink: #120f1f;
      --card: rgba(18, 14, 33, 0.52);
      --card-border: rgba(255,255,255,0.14);
      --text: #f7f5ff;
      --dim: #c3bde0;
      --cop: #ff7fb0;
      --usd: #4be9d6;
      --font: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body{ height: 100%; }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      background: var(--ink);
      overflow: hidden;
      position: relative;
    }

    /* ---- Fondo animado tipo mesh gradient ---- */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.75;
      z-index: 0;
      will-change: transform;
    }
    .bg-blob.b1 {
      width: 340px; height: 340px;
      background: var(--violet);
      top: -80px; left: -60px;
      animation: float1 14s ease-in-out infinite;
    }
    .bg-blob.b2 {
      width: 300px; height: 300px;
      background: var(--magenta);
      bottom: -70px; right: -60px;
      animation: float2 16s ease-in-out infinite;
    }
    .bg-blob.b3 {
      width: 260px; height: 260px;
      background: var(--cyan);
      bottom: 10%; left: -80px;
      opacity: 0.5;
      animation: float3 18s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.1); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(-30px, -40px) scale(1.15); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(30px, -20px) scale(0.9); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-blob { animation: none !important; }
    }

    /* ---- Tarjeta glass ---- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-radius: 28px;
      padding: 26px 24px 22px;
      box-shadow:
        0 20px 60px -20px rgba(76, 59, 207, 0.55),
        0 0 0 1px rgba(255,255,255,0.03) inset;
    }

    .live-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .pulse-dot {
      position: relative;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--usd);
      flex-shrink: 0;
    }
    .pulse-dot::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: var(--usd);
      opacity: 0.5;
      animation: pulse 1.8s ease-out infinite;
    }
    .pulse-dot.stale { background: var(--dim); }
    .pulse-dot.stale::after { background: var(--dim); animation: none; opacity: 0; }

    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.5; }
      100% { transform: scale(2); opacity: 0; }
    }

    .live-label {
      font-size: 12.5px;
      color: var(--dim);
      font-weight: 500;
    }

    .rate-info {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-align: center;
      background: linear-gradient(100deg, var(--usd), var(--magenta) 70%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 20px;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }
    .rate-info .unit {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--dim);
      background: none;
      -webkit-text-fill-color: var(--dim);
      margin-top: 2px;
    }

    .toggle-btn {
      appearance: none;
      width: 100%;
      border: none;
      background: linear-gradient(120deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      color: var(--text);
      padding: 14px 16px;
      border-radius: 16px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 18px;
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), background 0.2s ease;
    }
    .toggle-btn:active { transform: scale(0.96); }
    .toggle-btn .arrow {
      display: inline-flex;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
      color: var(--cop);
    }
    .toggle-btn.flipped .arrow { transform: rotate(180deg); color: var(--usd); }

    label.field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--dim);
      margin-bottom: 8px;
    }

    input#amount {
      width: 100%;
      padding: 15px 16px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.06);
      font-family: var(--font);
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 18px;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    input#amount::placeholder { color: rgba(247,245,255,0.35); font-weight: 500; }
    input#amount:focus {
      outline: none;
      border-color: var(--usd);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 4px rgba(75,233,214,0.18);
    }

    button.convert-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(120deg, var(--magenta), var(--violet) 60%, var(--usd));
      background-size: 200% 100%;
      background-position: 0% 0%;
      color: #fff;
      font-family: var(--font);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), background-position 0.4s ease;
      box-shadow: 0 12px 26px -10px rgba(232, 68, 126, 0.55);
    }
    button.convert-btn:hover { background-position: 100% 0%; }
    button.convert-btn:active { transform: scale(0.97); }

    .result {
      margin-top: 20px;
      min-height: 30px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
      opacity: 0;
      transform: translateY(6px) scale(0.98);
    }
    .result.pop {
      animation: resultIn 0.35s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes resultIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .foot {
      margin-top: 18px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--dim);
      opacity: 0.7;
    }

    @media (max-width: 360px){
      .card { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>

  <div class="card">
    <div class="live-row">
      <span class="pulse-dot" id="liveDot"></span>
      <span class="live-label">Tasa en vivo · USD/COP</span>
    </div>

    <div class="rate-info" id="rateInfo">Cargando tasa...</div>

    <button class="toggle-btn" id="directionBtn" onclick="toggleDirection()">
      <span>COP → USD</span>
      <span class="arrow">⇄</span>
    </button>

    <label class="field-label" for="amount">CANTIDAD</label>
    <input type="text" id="amount" placeholder="0" oninput="formatInput(this)" inputmode="numeric" />

    <button class="convert-btn" onclick="convert()">Convertir</button>

    <div class="result" id="result"></div>

    <div class="foot">Fran's Dev</div>
  </div>

  <script>
  let rateCopToUsd = 0.00025;
  let rateUsdToCop = 4000;
  let direction = "copToUsd"; // Valor inicial

  // 🔄 Obtener tasa de cambio actual automáticamente
  async function getLiveRate() {
    try {
      const res = await fetch("https://api.frankfurter.dev/v2/rate/USD/COP");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      rateUsdToCop = data.rate;
      rateCopToUsd = 1 / rateUsdToCop;
      console.log(`Tasa actualizada: 1 USD = ${rateUsdToCop} COP`);
      document.getElementById("rateInfo").innerHTML = `${rateUsdToCop.toLocaleString('en-US', {maximumFractionDigits: 2})}<span class="unit">COP por 1 USD</span>`;
      document.getElementById("liveDot").classList.remove("stale");
    } catch (error) {
      console.error("Error al obtener la tasa actual:", error);
      document.getElementById("rateInfo").innerHTML = `4,000<span class="unit">COP por 1 USD (valor por defecto)</span>`;
      document.getElementById("liveDot").classList.add("stale");
    }
  }

  // Llama la función al cargar la página
  getLiveRate();

  function formatNumber(num) {
    return num.toLocaleString('en-US');
  }

  function parseFormattedNumber(value) {
    return parseFloat(value.replace(/[^0-9.]/g, ''));
  }

  function formatInput(input) {
    let val = input.value.replace(/[^0-9]/g, '');
    if (val !== '') {
      let formatted = Number(val).toLocaleString('en-US');
      input.value = formatted;
    } else {
      input.value = '';
    }
  }

  // 🔁 Cambiar dirección al hacer clic
  function toggleDirection() {
    const btn = document.getElementById("directionBtn");
    if (direction === "copToUsd") {
      direction = "usdToCop";
      btn.querySelector("span").textContent = "USD → COP";
    } else {
      direction = "copToUsd";
      btn.querySelector("span").textContent = "COP → USD";
    }
    btn.classList.toggle("flipped");
  }

  function convert() {
    const rawValue = document.getElementById("amount").value;
    const amount = parseFormattedNumber(rawValue);
    const resultElement = document.getElementById("result");

    if (isNaN(amount) || amount <= 0) {
      resultElement.textContent = "Ingresa una cantidad válida.";
      resultElement.classList.remove("pop");
      void resultElement.offsetWidth;
      resultElement.classList.add("pop");
      return;
    }

    let result;
    if (direction === "copToUsd") {
      result = amount * rateCopToUsd;
      resultElement.textContent = `${formatNumber(amount)} COP ≈ $${result.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
    } else {
      result = amount * rateUsdToCop;
      resultElement.textContent = `$${formatNumber(amount)} USD ≈ ${formatNumber(result)} COP`;
    }
    resultElement.classList.remove("pop");
    void resultElement.offsetWidth;
    resultElement.classList.add("pop");
  }
</script>

</body>
</html>
